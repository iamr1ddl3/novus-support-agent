AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Novus Support Agent (LangGraph) - ECS Fargate + ALB
  Stack: acmera-support-dev | Region: ap-south-1

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AppKeysSecretArn:
    Type: String
    Description: >
      Full ARN of an existing Secrets Manager secret (created outside this stack)
      whose JSON holds OPENAI_API_KEY, LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY.
      Keeps every API key out of this template and out of stack parameters.

  RagApiUrl:
    Type: String
    Description: Base URL of the Project A RAG API (its acmera-kb-dev APIEndpoint output)

  LangfuseHost:
    Type: String
    Default: https://us.cloud.langfuse.com
    AllowedPattern: "https://.+"
    Description: >
      LangFuse host the app sends traces to. Must match the region of the
      LangFuse project whose keys are in AppKeysSecretArn
      (US https://us.cloud.langfuse.com, EU https://cloud.langfuse.com).

  UseSpot:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Run tasks on Fargate Spot (about 70% cheaper; AWS may occasionally
      replace a task). Set "false" for an interview or a demo that must not blip.

  ContainerPort:
    Type: Number
    Default: 8080

  TaskCpu:
    Type: String
    Default: "1024"

  # 3072 MB per D5.1 spec - LangGraph state is heavier than plain pipeline
  TaskMemory:
    Type: String
    Default: "3072"

Conditions:
  UseSpotCapacity: !Equals [!Ref UseSpot, "true"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # VPC + Networking
  # -------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub acmera-support-${Environment}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public subnets (ALB)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub acmera-support-${Environment}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.1.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub acmera-support-${Environment}-public-b

  # Public route table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # No NAT gateway (about $1/day each): ECS tasks run in the public subnets with
  # a public IP for outbound calls (OpenAI, Langfuse, Cohere). Inbound is still
  # locked to the ALB by ECSSecurityGroup, so tasks are not reachable directly.

  # -------------------------------------------------------------------------
  # Security Groups
  # -------------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - allow traffic only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # -------------------------------------------------------------------------
  # ECS Cluster + IAM
  # -------------------------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub acmera-support-${Environment}-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub acmera-support-${Environment}-task-exec-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppKeysSecretArn

  # -------------------------------------------------------------------------
  # CloudWatch Log Group
  # -------------------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/acmera-support-${Environment}
      RetentionInDays: 7

  # -------------------------------------------------------------------------
  # ECS Task Definition
  # -------------------------------------------------------------------------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub acmera-support-${Environment}-task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: novus-support
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/acmera-support-dev:latest
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/acmera-support-${Environment}
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Secrets:
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub "${AppKeysSecretArn}:OPENAI_API_KEY::"
            - Name: LANGFUSE_PUBLIC_KEY
              ValueFrom: !Sub "${AppKeysSecretArn}:LANGFUSE_PUBLIC_KEY::"
            - Name: LANGFUSE_SECRET_KEY
              ValueFrom: !Sub "${AppKeysSecretArn}:LANGFUSE_SECRET_KEY::"
          Environment:
            # PG_PORT kept per D5.1 spec; not actively used by current retrieval (file-based)
            - Name: PG_PORT
              Value: "5434"
            - Name: LANGFUSE_HOST
              Value: !Ref LangfuseHost
            - Name: RAG_API_URL
              Value: !Ref RagApiUrl

  # -------------------------------------------------------------------------
  # ALB
  # -------------------------------------------------------------------------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub acmera-support-${Environment}-alb
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing
      Type: application

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub acmera-support-${Environment}-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # -------------------------------------------------------------------------
  # ECS Service
  # -------------------------------------------------------------------------
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub acmera-support-${Environment}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      CapacityProviderStrategy:
        - CapacityProvider: !If [UseSpotCapacity, FARGATE_SPOT, FARGATE]
          Weight: 1
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: novus-support
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref ALBTargetGroup
      HealthCheckGracePeriodSeconds: 90

  # -------------------------------------------------------------------------
  # ECS Auto Scaling
  # Tasks are heavier than Project A (1vCPU/3GB, multi-hop LLM) — max=5
  # Same CPU threshold (60%) and cooldown asymmetry (60s out / 300s in)
  # -------------------------------------------------------------------------
  ECSScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ECSService
    Properties:
      MaxCapacity: 5
      MinCapacity: 1
      ResourceId: !Sub "service/acmera-support-${Environment}-cluster/acmera-support-${Environment}-service"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ECSScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub acmera-support-${Environment}-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  APIEndpoint:
    Description: ALB DNS - use as AGENT_URL in curl tests
    Value: !Sub http://${ALB.DNSName}

  ECRRepository:
    Description: ECR repository URI
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/acmera-support-dev
